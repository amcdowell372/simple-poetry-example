<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Small True Note</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --amber: #ffb36a;
      --coral: #ff7a59;
      --rose: #e85d75;
      --magenta: #c43d7a;
      --dusk: #5c1a5c;
      --night: #2a0a3a;
      --cream: #fff4e8;
      --blush: rgba(255, 232, 214, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 120% 80% at 15% 10%, rgba(255, 179, 106, 0.55), transparent 55%),
        radial-gradient(ellipse 90% 70% at 90% 20%, rgba(232, 93, 117, 0.5), transparent 50%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(42, 10, 58, 0.95), transparent 55%),
        linear-gradient(165deg, #ff9a56 0%, #ff6b5a 22%, #e85d75 48%, #8b2d6b 76%, #2a0a3a 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255, 244, 232, 0.18) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(42rem, 100%);
      text-align: center;
    }

    header {
      margin-bottom: 2.75rem;
      animation: fadeDown 1.1s ease-out both;
    }

    .ornament {
      display: block;
      width: 4.5rem;
      height: 1px;
      margin: 0 auto 1.35rem;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      opacity: 0.85;
    }

    h1 {
      font-family: "Great Vibes", "Cormorant Garamond", serif;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--cream);
      text-shadow: 0 8px 28px rgba(42, 10, 58, 0.35);
      line-height: 1.15;
    }

    .subtitle {
      margin-top: 0.65rem;
      font-size: 0.95rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255, 244, 232, 0.72);
      font-weight: 500;
    }

    article {
      background: linear-gradient(180deg, rgba(255, 244, 232, 0.16), rgba(42, 10, 58, 0.18));
      border: 1px solid rgba(255, 232, 214, 0.22);
      border-radius: 1.35rem;
      padding: 3rem 2.4rem 2.8rem;
      box-shadow:
        0 24px 60px rgba(42, 10, 58, 0.32),
        inset 0 1px 0 rgba(255, 244, 232, 0.28);
      backdrop-filter: blur(14px);
    }

    .stanza {
      font-size: clamp(1.35rem, 2.6vw, 1.7rem);
      font-weight: 500;
      font-style: italic;
      line-height: 1.85;
      color: var(--blush);
      opacity: 0;
      animation: fadeInUp 1.15s ease-out forwards;
    }

    .stanza:first-of-type {
      animation-delay: 0.45s;
      margin-bottom: 1.85rem;
    }

    .stanza:last-of-type {
      animation-delay: 1.15s;
    }

    .stanza p + p {
      margin-top: 0.15rem;
    }

    footer {
      margin-top: 2.4rem;
      animation: fadeIn 1.4s ease-out 1.7s both;
    }

    .date {
      font-size: 0.82rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 244, 232, 0.78);
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 540px) {
      article {
        padding: 2.2rem 1.4rem 2rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="ornament" aria-hidden="true"></span>
      <h1>A Small True Note</h1>
      <p class="subtitle">A poem</p>
    </header>

    <article>
      <section class="stanza">
        <p>A quiet page, a waiting line—</p>
        <p>ink gathers, then the words align.</p>
      </section>
      <section class="stanza">
        <p>Not thunder, just a small true note:</p>
        <p>a poem folded in a coat.</p>
      </section>
    </article>

    <footer>
      <p class="date">September 14, 2026</p>
    </footer>
  </main>
</body>
</html>
